name: Web release checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-web-lock.txt
      - run: python -m pip install --require-hashes -r requirements-web-lock.txt
      - run: python -m pip install --require-hashes -r requirements-lock.txt
      - run: python scripts/check_release.py
      - run: python -B -m unittest discover -s tests -q
      - run: python desktop.py --self-test-report web-self-test.json
      - uses: actions/upload-artifact@v4
        with:
          name: web-self-test
          path: web-self-test.json
